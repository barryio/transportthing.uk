[program:import_planes]
command=/path/to/your/project/manage.py import_planes
directory=/path/to/your/project
user=your_user
autostart=false
autorestart=false
startsecs=10
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/import_planes.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3